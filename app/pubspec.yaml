name: mfb_pro
description: MFB-PRO smart gauge (BLE client for ESP32 K-Line gauge)
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.12
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true
