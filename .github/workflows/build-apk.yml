name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # เก็บ Gradle + ไลบรารีที่โหลดแล้วไว้ใช้ซ้ำ (รอบถัดไปไม่ต้องโหลดจากเน็ตใหม่ = เร็วขึ้น และไม่พังเพราะเซิร์ฟเวอร์ดาวน์โหลดล่ม)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # สร้างโครง Android ให้อัตโนมัติ โดยไม่ทับ main.dart / pubspec.yaml ของเรา
      - name: Generate Android scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart
          flutter create . --platforms=android --project-name mfb_pro --org com.mfbpro
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart

      # โหลด Gradle เองแบบลองซ้ำหลายครั้ง (แก้ error 504 Gateway Time-out ตอนโหลด gradle-x.x.x-all.zip)
      - name: Pre-download Gradle (retry)
        run: |
          P=android/gradle/wrapper/gradle-wrapper.properties
          URL=$(grep '^distributionUrl' "$P" | cut -d= -f2- | sed 's#\\:#:#g')
          F=$(basename "$URL")
          C=$(ls ~/.gradle/wrapper/dists/*/*/"$F" 2>/dev/null | head -1 || true)
          if [ -n "$C" ]; then
            echo "ใช้ Gradle จากแคช: $C"; cp "$C" "/tmp/$F"
          else
            ok=0
            for u in "$URL" "https://services.gradle.org/distributions/$F"; do
              echo "โหลด $u"
              if curl -fL --retry 8 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o "/tmp/$F" "$u"; then ok=1; break; fi
            done
            [ "$ok" = 1 ] || { echo "โหลด Gradle ไม่สำเร็จ (เซิร์ฟเวอร์ยังล่ม) ลอง Re-run อีกครั้งภายหลัง"; exit 1; }
          fi
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\:///tmp/$F#" "$P"
          grep '^distributionUrl' "$P"

      - name: Add BLE / GPS permissions + app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          python3 - "$M" <<'PY'
          import sys, re
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          perms = '''
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true"/>
          '''
          s = re.sub(r'(<manifest[^>]*>)', r'\1' + perms, s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="MFB-PRO"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      # แก้ error: ไลบรารีบางตัวคอมไพล์กับ android-33 แต่ dependency ต้องการ 34+
      - name: Force compileSdk 36 for plugin modules
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOG'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.library')) {
                p.android.compileSdkVersion 36
              }
            }
          }
          EOG

      # อ่านจำนวนดาวเทียมจริงจาก Android (GnssStatus) ส่งให้หน้า DRAG LOG ผ่าน EventChannel "mfb/gnss"
      - name: Add GNSS satellite channel (MainActivity.kt)
        run: |
          F=$(find android/app/src/main -name MainActivity.kt | head -1)
          PKG=$(grep -m1 '^package ' "$F")
          cat > /tmp/ma_body.kt <<'EOK'

          import android.annotation.SuppressLint
          import android.content.Context
          import android.location.GnssStatus
          import android.location.LocationManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import androidx.annotation.RequiresApi
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.EventChannel

          class MainActivity : FlutterActivity() {
              private var cb: Any? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  EventChannel(flutterEngine.dartExecutor.binaryMessenger, "mfb/gnss").setStreamHandler(object : EventChannel.StreamHandler {
                      override fun onListen(args: Any?, sink: EventChannel.EventSink?) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && sink != null) startGnss(sink)
                      }
                      override fun onCancel(args: Any?) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) stopGnss()
                      }
                  })
              }

              @RequiresApi(Build.VERSION_CODES.N)
              @SuppressLint("MissingPermission")
              private fun startGnss(sink: EventChannel.EventSink) {
                  val lm = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  val c = object : GnssStatus.Callback() {
                      override fun onSatelliteStatusChanged(status: GnssStatus) {
                          var used = 0
                          for (i in 0 until status.satelliteCount) if (status.usedInFix(i)) used++
                          sink.success(mapOf("used" to used, "visible" to status.satelliteCount))
                      }
                  }
                  cb = c
                  try {
                      lm.registerGnssStatusCallback(c, Handler(Looper.getMainLooper()))
                  } catch (e: Exception) {
                      sink.error("gnss", e.message, null)
                  }
              }

              @RequiresApi(Build.VERSION_CODES.N)
              private fun stopGnss() {
                  val lm = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  (cb as? GnssStatus.Callback)?.let { lm.unregisterGnssStatusCallback(it) }
                  cb = null
              }
          }
          EOK
          { echo "$PKG"; cat /tmp/ma_body.kt; } > "$F"

      - run: flutter pub get

      - name: Generate launcher icon (ถ้ามี app/assets/icon.png)
        run: |
          if [ -f assets/icon.png ]; then
            dart run flutter_launcher_icons
          else
            echo "no assets/icon.png - using default icon"
          fi

      # ลอง build ซ้ำสูงสุด 3 ครั้ง (ถ้าโหลดไลบรารีจาก Maven/GitHub ล้มชั่วคราว)
      - name: Build APK
        run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "build ล้ม (รอบ $i) รอ 30 วินาทีแล้วลองใหม่"; sleep 30
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: MFB-PRO-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
